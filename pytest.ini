[pytest]
addopts = -q -ra
testpaths = tests
xfail_strict = true
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
markers =
    smoke: quick availability checks
    regression: full site coverage
    accessibility: axe-core checks
    security: basic security header checks
    navigation: menus and links
    forms: validation and submission
    content: static content verification

